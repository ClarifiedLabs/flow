# flow-orchestrator reconciles durable one-shot capacity slots into one
# batch/v1 Job and one private Secret per slot. Idle slots are controlled by
# each profile's idle_capacity; there is no reusable worker Deployment.
#
# Apply after k8s/server.yaml:
#   kubectl apply -f k8s/orchestrator.yaml
#
# Before applying a release, pin both image fields below to the desired release
# tag or digest. The worker image is profile configuration because the
# orchestrator injects it into every slot Job for that profile.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flow-orchestrator
  namespace: flow
---
# Assignment workers do not call the Kubernetes API. Keeping this account
# separate from the orchestrator prevents generated Jobs from inheriting its
# provisioning permissions or even an API token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flow-worker
  namespace: flow
automountServiceAccountToken: false
---
# Provider profiles are file-only configuration. Store and mount the file as a
# Secret even though the coordinator credential remains in flow-tokens. The
# mounted file is group-readable only by the pod's flow group (GID 1000).
apiVersion: v1
kind: Secret
metadata:
  name: flow-orchestrator-config
  namespace: flow
type: Opaque
stringData:
  flow-orchestrator.yaml: |
    coordinator_url: http://flow-server:8421
    poll_interval: 5s
    retry_base: 1s
    retry_max: 1m

    profiles:
      - name: linux-agent
        provider: kubernetes
        provider_id: in-cluster
        # Active work is capped separately from the verified warm slots below.
        max_concurrency: 10
        idle_capacity: 1
        startup_timeout: 2m
        allowed_roles: [author, reviewer, verifier, console]
        accepts: [persistent_agent]
        labels:
          os: linux
          # Reserved capability labels are verified by the launched worker.
          agent.harness.harness: "true"
        kubernetes:
          namespace: flow
          # Release-configurable image used by generated worker Jobs. The
          # published image is the minimal base and already ships Harness, so
          # it satisfies the agent.harness.harness capability above.
          image: ghcr.io/clarifiedlabs/flow-worker:latest
          service_account: flow-worker
          work_dir: /var/lib/flow-worker
          image_pull_policy: IfNotPresent
          # Pod-scoped dynamic PVC; requires a default StorageClass. Set
          # storage_class_name here when the cluster has no suitable default.
          work_volume:
            type: generic_ephemeral
            mount_path: /var/lib/flow-worker
            size: 20Gi
            access_modes: [ReadWriteOnce]
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              memory: 4Gi
          node_selector:
            kubernetes.io/os: linux
          # Provision this Secret out of band; Kind creates it from local env vars.
          harness_model_proxy_secret_name: flow-harness-model-proxy
          # Optional: an absolute path inside this pod to a Harness JSON config
          # installed as every job's global Harness config
          # ($HOME/.config/harness/config.json). It supplies deployment-wide
          # defaults only: a repo's .harness/config.json still wins per key and
          # harness_args/flags and HARNESS_* env win over it. The file must be a
          # JSON object matching the Harness version in the worker image and is
          # delivered to workers through the private per-slot Secret.
          # harness_config_file: /etc/flow/harness/config.json

      # Profiles are independent and may use a leaner image and different
      # credentials for jobs that do not require Harness.
      - name: linux-ci
        provider: kubernetes
        provider_id: in-cluster
        max_concurrency: 10
        idle_capacity: 0
        startup_timeout: 2m
        allowed_roles: [ci]
        accepts: [ephemeral]
        labels:
          os: linux
        kubernetes:
          namespace: flow
          image: ghcr.io/clarifiedlabs/flow-worker:latest
          service_account: flow-worker
          work_dir: /var/lib/flow-worker
          image_pull_policy: IfNotPresent
          work_volume:
            type: empty_dir
            size_limit: 20Gi
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
          node_selector:
            kubernetes.io/os: linux

    metrics:
      listen: ":8422"
---
# Least privilege for the provider's exact REST calls in this namespace:
# POST/GET/DELETE Jobs and POST/GET/PUT/DELETE Secrets. Secret reads are used
# only to verify assignment ownership before replacement or deletion; response
# bodies and direct assignment credentials are never logged.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: flow-orchestrator
  namespace: flow
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "get", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flow-orchestrator
  namespace: flow
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: flow-orchestrator
subjects:
  - kind: ServiceAccount
    name: flow-orchestrator
    namespace: flow
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flow-orchestrator
  namespace: flow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flow-orchestrator
  template:
    metadata:
      labels:
        app: flow-orchestrator
    spec:
      serviceAccountName: flow-orchestrator
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: flow-orchestrator
          # Pin with the worker image above when deploying a release.
          image: ghcr.io/clarifiedlabs/flow-orchestrator:latest
          command:
            - flow-orchestrator
          args:
            - --config
            - /etc/flow/flow-orchestrator.yaml
          env:
            # The orchestrator-scoped coordinator token is sourced from a
            # Secret, never written into the Deployment or profile file.
            - name: FLOW_ORCHESTRATOR_TOKEN
              valueFrom:
                secretKeyRef:
                  name: flow-tokens
                  key: orchestrator
          ports:
            # Unauthenticated telemetry is pod/cluster-internal only. Do not
            # expose this port through an Ingress or LoadBalancer.
            - name: telemetry
              containerPort: 8422
          # Ready only after one complete recovery-first reconciliation cycle
          # succeeds against both the coordinator and Kubernetes API.
          readinessProbe:
            httpGet:
              path: /readyz
              port: telemetry
          # Liveness reports process health and does not depend on upstreams.
          livenessProbe:
            httpGet:
              path: /livez
              port: telemetry
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/flow/flow-orchestrator.yaml
              subPath: flow-orchestrator.yaml
              readOnly: true
            # Optional global Harness config for kubernetes.harness_config_file.
            # - name: harness-config
            #   mountPath: /etc/flow/harness
            #   readOnly: true
      volumes:
        - name: config
          secret:
            secretName: flow-orchestrator-config
            # 0440 plus fsGroup keeps the profile private and readable by the
            # non-root flow process.
            defaultMode: 0440
            items:
              - key: flow-orchestrator.yaml
                path: flow-orchestrator.yaml
        # Optional global Harness config mounted for harness_config_file:
        # - name: harness-config
        #   configMap:
        #     name: flow-harness-config
        #     defaultMode: 0440
        #     items:
        #       - key: config.json
        #         path: config.json
