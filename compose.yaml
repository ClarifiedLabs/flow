services:
  flow-server:
    build:
      context: .
      target: flow-server
      args:
        FLOW_UID: ${FLOW_UID:-1000}
        FLOW_GID: ${FLOW_GID:-1000}
    image: flow-server:local
    command:
      - flow-server
      - serve
      - --config
      - /usr/share/flow/examples/docker/flow-server.yaml
      - --owner-token
      - ${FLOW_OWNER_TOKEN:?Set FLOW_OWNER_TOKEN in .env}
    environment:
      FLOW_GIT_COMMIT_NAME: ${FLOW_GIT_COMMIT_NAME}
      FLOW_GIT_COMMIT_EMAIL: ${FLOW_GIT_COMMIT_EMAIL}
    ports:
      - "127.0.0.1:8421:8421"
    volumes:
      - flow-data:/var/lib/flow
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8421/v2/health"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  flow-data:
