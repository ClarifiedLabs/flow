data_dir: ~/.local/share/flow
listen_addr: 127.0.0.1:8421
protocol_version: "3"
# Existing active leases are reserved for surviving workers for this long after
# a coordinator restart becomes ready.
workers:
  reconnect_grace: "2m"
limits:
  # Pause for an owner convergence decision after two review-to-author cycles
  # or before reviewing a change larger than either scope threshold.
  review_author_cycles: 2
  review_scope_files: 10
  review_scope_lines: 500
# Git identity for the squash-merge commit the coordinator creates. When
# omitted, Flow Coordinator <flow@example.invalid> is used.
# git:
#   commit_name: Flow Bot
#   commit_email: flow-bot@example.com
