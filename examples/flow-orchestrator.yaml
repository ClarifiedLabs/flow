# flow-orchestrator reserves durable coordinator assignments and creates one
# signal-aware, one-shot worker runtime for each exact job. It recovers existing
# assignments and provider resources before reserving new work.
coordinator_url: http://flow-server:8421
poll_interval: 5s
retry_base: 2s
retry_max: 1m

# Supply a dedicated orchestrator-scoped bearer token with
# FLOW_ORCHESTRATOR_TOKEN instead of storing it in this file.
profiles:
  - name: linux-default
    provider: kubernetes
    provider_id: in-cluster
    max_concurrency: 10
    accepts: [persistent_agent, ephemeral]
    labels:
      os: linux
    startup_timeout: 5m
    kubernetes:
      namespace: flow
      image: ghcr.io/clarifiedlabs/flow-worker:latest
      image_pull_policy: Always
      work_dir: /flow/work
      # Provision this Secret out of band; it supplies worker proxy credentials.
      harness_model_proxy_secret_name: flow-harness-model-proxy

# Run a separate flow-orchestrator process on a macOS host for native Darwin
# work. Do not enable this profile in the in-cluster Linux Deployment.
#  - name: macos-default
#    provider: darwin
#    provider_id: macos-host-1
#    max_concurrency: 2
