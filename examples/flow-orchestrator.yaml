#    labels:
#      os: macos
#    startup_timeout: 5m
#    darwin:
#      binary: /usr/local/bin/flow-worker
#      state_dir: ~/.local/share/flow/orchestrator/assignments
#      work_dir: ~/.local/share/flow/workers/assignments

# Telemetry is unauthenticated. In Kubernetes, bind on the pod interface but
# expose it only to cluster-internal probes and Prometheus.
metrics:
  listen: ":8422"
