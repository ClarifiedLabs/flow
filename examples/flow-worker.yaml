worker_id: w-local
coordinator_url: http://127.0.0.1:8421
work_dir: ~/.local/share/flow/workers/local
protocol_version: "4"
labels:
  local: "true"
capacity:
  persistent_agent: 5
  ephemeral: 5
git:
  principal: worker:w-local
  # Git identity the harness/agent commits under in the job worktree. When
  # omitted, the agent inherits the worker environment's git identity.
  # commit_name: Flow Bot
  # commit_email: flow-bot@example.com
