worker_id: compose
coordinator_url: http://flow-server:8421
work_dir: /flow/work
labels:
  local: "true"
# Bucket acceptance is boolean; this compatibility worker claims sequentially.
accepts: [persistent_agent, ephemeral]
cleanup:
  interval: 5m
  orphan_grace: 1h
  min_free_percent: 10
  resume_free_percent: 15
git:
  principal: worker:compose
